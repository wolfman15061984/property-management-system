
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AQARI | عقاري</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f3f6fb;
  color: #172b4d;
}
header {
  background: #142d50;
  color: white;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}
.logo { font-size: 27px; font-weight: bold; }
.logo small { font-size: 12px; display: block; }
select {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccd5e2;
}
.layout { display: flex; min-height: 85vh; }
aside {
  width: 235px;
  background: #1d3c67;
  color: white;
  padding: 20px 12px;
}
aside a {
  display: block;
  padding: 14px;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  margin-bottom: 5px;
}
aside a:hover { background: #315685; }
main {
  flex: 1;
  min-width: 0;
  padding: 28px;
}
.cards {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
  margin-top: 25px;
}
.card, section {
  background: white;
  border-radius: 13px;
  padding: 22px;
  box-shadow: 0 2px 9px #142d5010;
}
.card p { color: #64748b; }
.card strong { font-size: 27px; color: #2563eb; }
section { margin-top: 25px; }
button {
  background: #2563eb;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  padding: 13px;
  text-align: start;
  border-bottom: 1px solid #e5eaf2;
}
.table-wrap { overflow-x: auto; }
.note { color: #64748b; font-size: 13px; }
@media(max-width: 700px) {
  .layout { display: block; }
  aside {
    width: 100%;
    display: flex;
    overflow-x: auto;
    gap: 5px;
  }
  aside a {
    white-space: nowrap;
    font-size: 13px;
  }
  main { padding: 16px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    عقاري
    <small>AQARI</small>
  </div>
  <select id="language" onchange="setLanguage(this.value)">
    <option value="ar">العربية</option>
    <option value="en">English</option>
  </select>
</header>

<div class="layout">
  <aside>
    <a href="#dashboard" data-i18n="dashboard"></a>
    <a href="#properties" data-i18n="properties"></a>
    <a href="#tenants" data-i18n="tenants"></a>
    <a href="#payments" data-i18n="payments"></a>
    <a href="#expenses" data-i18n="expenses"></a>
    <a href="#reports" data-i18n="reports"></a>
  </aside>

  <main id="dashboard">
    <h1 data-i18n="dashboard"></h1>
    <p data-i18n="welcome"></p>

    <div class="cards">
      <div class="card">
        <p data-i18n="totalProperties"></p>
        <strong>0</strong>
      </div>
      <div class="card">
        <p data-i18n="totalUnits"></p>
        <strong>0</strong>
      </div>
      <div class="card">
        <p data-i18n="collected"></p>
        <strong>0 JOD</strong>
      </div>
      <div class="card">
        <p data-i18n="outstanding"></p>
        <strong>0 JOD</strong>
      </div>
    </div>

    <section id="properties">
      <h2 data-i18n="properties"></h2>
      <button onclick="showNotice()" data-i18n="addProperty"></button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="propertyName"></th>
              <th data-i18n="location"></th>
              <th data-i18n="units"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="3" data-i18n="noProperties"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="tenants">
      <h2 data-i18n="tenants"></h2>
      <p data-i18n="noTenants"></p>
    </section>

    <section id="payments">
      <h2 data-i18n="payments"></h2>
      <p data-i18n="noPayments"></p>
    </section>

    <section id="expenses">
      <h2 data-i18n="expenses"></h2>
      <p data-i18n="noExpenses"></p>
    </section>

    <section id="reports">
      <h2 data-i18n="reports"></h2>
      <p data-i18n="noReports"></p>
    </section>

    <p class="note" data-i18n="demo"></p>
  </main>
</div>

<script>
const translations = {
  ar: {
    dashboard: "لوحة التحكم",
    properties: "العقارات",
    tenants: "المستأجرون والعقود",
    payments: "الإيجارات والدفعات",
    expenses: "المصروفات",
    reports: "التقارير المالية",
    welcome: "مرحباً بك في نظام عقاري لإدارة ممتلكاتك",
    totalProperties: "إجمالي العقارات",
    totalUnits: "الوحدات العقارية",
    collected: "الإيجارات المحصلة",
    outstanding: "الإيجارات المتأخرة",
    addProperty: "+ إضافة عقار",
    propertyName: "اسم العقار",
    location: "الموقع",
    units: "الوحدات",
    noProperties: "لم تتم إضافة عقارات بعد",
    noTenants: "لا توجد عقود مسجلة بعد",
    noPayments: "لا توجد دفعات مسجلة بعد",
    noExpenses: "لا توجد مصروفات مسجلة بعد",
    noReports: "ستظهر التقارير المالية هنا",
    demo: "نسخة تجريبية للواجهة — لا يتم حفظ البيانات بعد",
    comingSoon: "سنضيف وظيفة إضافة العقارات في الخطوة التالية"
  },
  en: {
    dashboard: "Dashboard",
    properties: "Properties",
    tenants: "Tenants & Contracts",
    payments: "Rent & Payments",
    expenses: "Expenses",
    reports: "Financial Reports",
    welcome: "Welcome to AQARI Property Management",
    totalProperties: "Total Properties",
    totalUnits: "Total Units",
    collected: "Rent Collected",
    outstanding: "Outstanding Rent",
    addProperty: "+ Add Property",
    propertyName: "Property Name",
    location: "Location",
    units: "Units",
    noProperties: "No properties added yet",
    noTenants: "No contracts recorded yet",
    noPayments: "No payments recorded yet",
    noExpenses: "No expenses recorded yet",
    noReports: "Financial reports will appear here",
    demo: "Interface demo — data is not saved yet",
    comingSoon: "We will build Add Property next"
  }
};

let currentLanguage = "ar";

function setLanguage(lang) {
  currentLanguage = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir =
    lang === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.textContent = translations[lang][key] || key;
  });

  document.getElementById("language").value = lang;
  localStorage.setItem("aqari-language", lang);
}

function showNotice() {
  alert(translations[currentLanguage].comingSoon);
}

const savedLanguage =
  localStorage.getItem("aqari-language");

setLanguage(savedLanguage === "en" ? "en" : "ar");
</script>

</body>
</html>
