
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AQARI | عقاري</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f3f6fb;
  color: #172b4d;
}
header {
  background: #142d50;
  color: white;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}
.logo { font-size: 27px; font-weight: bold; }
.logo small { font-size: 12px; display: block; }
select, input, textarea {
  padding: 11px;
  border-radius: 8px;
  border: 1px solid #ccd5e2;
  width: 100%;
  font: inherit;
}
#language { width: auto; }
.layout { display: flex; min-height: 85vh; }
aside {
  width: 235px;
  background: #1d3c67;
  color: white;
  padding: 20px 12px;
  flex-shrink: 0;
}
aside a {
  display: block;
  padding: 14px;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  margin-bottom: 5px;
}
aside a:hover { background: #315685; }
main {
  flex: 1;
  min-width: 0;
  padding: 28px;
}
.cards {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
  margin-top: 25px;
}
.card, section {
  background: white;
  border-radius: 13px;
  padding: 22px;
  box-shadow: 0 2px 9px #142d5010;
}
.card p { color: #64748b; }
.card strong { font-size: 27px; color: #2563eb; }
section { margin-top: 25px; }
button {
  background: #2563eb;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
}
button.secondary { background: #64748b; }
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  padding: 13px;
  text-align: start;
  border-bottom: 1px solid #e5eaf2;
}
.table-wrap { overflow-x: auto; }
.note { color: #64748b; font-size: 13px; }
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 10;
  padding: 15px;
  overflow-y: auto;
  align-items: center;
  justify-content: center;
}
.modal.open { display: flex; }
.modal-content {
  background: white;
  padding: 25px;
  border-radius: 14px;
  width: 100%;
  max-width: 540px;
  max-height: 95vh;
  overflow-y: auto;
}
.field { margin: 15px 0; }
.field label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}
.actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
@media(max-width: 700px) {
  .layout { display: block; }
  aside {
    width: 100%;
    display: flex;
    overflow-x: auto;
    gap: 5px;
  }
  aside a {
    white-space: nowrap;
    font-size: 13px;
  }
  main { padding: 16px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">عقاري<small>AQARI</small></div>
  <select id="language" onchange="setLanguage(this.value)">
    <option value="ar">العربية</option>
    <option value="en">English</option>
  </select>
</header>

<div class="layout">
  <aside>
    <a href="#dashboard" data-i18n="dashboard"></a>
    <a href="#properties" data-i18n="properties"></a>
    <a href="#tenants" data-i18n="tenants"></a>
    <a href="#payments" data-i18n="payments"></a>
    <a href="#expenses" data-i18n="expenses"></a>
    <a href="#reports" data-i18n="reports"></a>
  </aside>

  <main id="dashboard">
    <h1 data-i18n="dashboard"></h1>
    <p data-i18n="welcome"></p>

    <div class="cards">
      <div class="card">
        <p data-i18n="totalProperties"></p>
        <strong id="propertyCount">0</strong>
      </div>
      <div class="card">
        <p data-i18n="totalUnits"></p>
        <strong id="unitCount">0</strong>
      </div>
      <div class="card">
        <p data-i18n="collected"></p>
        <strong>0 JOD</strong>
      </div>
      <div class="card">
        <p data-i18n="outstanding"></p>
        <strong>0 JOD</strong>
      </div>
    </div>

    <section id="properties">
      <h2 data-i18n="properties"></h2>
      <button type="button" onclick="openModal()"
        data-i18n="addProperty"></button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="propertyName"></th>
              <th data-i18n="propertyType"></th>
              <th data-i18n="location"></th>
              <th data-i18n="units"></th>
              
<th id="actionsHeader"></th>
            </tr>
          </thead>
          <tbody id="propertyTable"></tbody>
        </table>
      </div>
    </section>

    <section id="tenants">
      <h2 data-i18n="tenants"></h2>
      <p data-i18n="noTenants"></p>
    </section>
    <section id="payments">
      <h2 data-i18n="payments"></h2>
      <p data-i18n="noPayments"></p>
    </section>
    <section id="expenses">
      <h2 data-i18n="expenses"></h2>
      <p data-i18n="noExpenses"></p>
    </section>
    <section id="reports">
      <h2 data-i18n="reports"></h2>
      <p data-i18n="noReports"></p>
    </section>

    <p class="note" data-i18n="demo"></p>
  </main>
</div>

<div class="modal" id="propertyModal">
  <div class="modal-content">
    <h2 data-i18n="addProperty"></h2>
    <form id="propertyForm">
      <div class="field">
        <label data-i18n="propertyName"></label>
        <input id="name" required maxlength="100">
      </div>
      <div class="field">
        <label data-i18n="propertyType"></label>
        <select id="type" required>
          <option value="building" data-i18n="building"></option>
          <option value="apartment" data-i18n="apartment"></option>
          <option value="villa" data-i18n="villa"></option>
          <option value="shop" data-i18n="shop"></option>
          <option value="office" data-i18n="office"></option>
          <option value="warehouse" data-i18n="warehouse"></option>
          <option value="land" data-i18n="land"></option>
          <option value="other" data-i18n="other"></option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="governorate"></label>
        <select id="governorate" required></select>
      </div>
      <div class="field">
        <label data-i18n="city"></label>
        <input id="city" required maxlength="100">
      </div>
      <div class="field">
        <label data-i18n="address"></label>
        <input id="address" required maxlength="200">
      </div>
      <div class="field">
        <label data-i18n="units"></label>
        <input id="units" type="number" min="0"
          max="100000" value="1" required>
      </div>
      <div class="field">
        <label data-i18n="notes"></label>
        <textarea id="notes" rows="3" maxlength="1000"></textarea>
      </div>
      <div class="actions">
        <button type="submit" data-i18n="save"></button>
        <button type="button" class="secondary"
          onclick="closeModal()" data-i18n="cancel"></button>
      </div>
    </form>
  </div>
</div>

<script>
const translations = {
  ar: {
    dashboard:"لوحة التحكم",
    properties:"العقارات",
    tenants:"المستأجرون والعقود",
    payments:"الإيجارات والدفعات",
    expenses:"المصروفات",
    reports:"التقارير المالية",
    welcome:"مرحباً بك في نظام عقاري لإدارة ممتلكاتك",
    totalProperties:"إجمالي العقارات",
    totalUnits:"الوحدات العقارية",
    collected:"الإيجارات المحصلة",
    outstanding:"الإيجارات المتأخرة",
    addProperty:"+ إضافة عقار",
    propertyName:"اسم العقار",
    propertyType:"نوع العقار",
    location:"الموقع",
    units:"عدد الوحدات",
    governorate:"المحافظة",
    city:"المدينة",
    address:"العنوان",
    notes:"ملاحظات",
    save:"حفظ العقار",
    cancel:"إلغاء",
    building:"عمارة",
    apartment:"شقة",
    villa:"فيلا",
    shop:"محل تجاري",
    office:"مكتب",
    warehouse:"مستودع",
    land:"أرض",
    other:"أخرى",
    noProperties:"لم تتم إضافة عقارات بعد",
    noTenants:"لا توجد عقود مسجلة بعد",
    noPayments:"لا توجد دفعات مسجلة بعد",
    noExpenses:"لا توجد مصروفات مسجلة بعد",
    noReports:"ستظهر التقارير المالية هنا",
    demo:"نسخة تجريبية — البيانات محفوظة في هذا المتصفح فقط",
    saved:"تم حفظ العقار بنجاح"
  },
  en: {
    dashboard:"Dashboard",
    properties:"Properties",
    tenants:"Tenants & Contracts",
    payments:"Rent & Payments",
    expenses:"Expenses",
    reports:"Financial Reports",
    welcome:"Welcome to AQARI Property Management",
    totalProperties:"Total Properties",
    totalUnits:"Total Units",
    collected:"Rent Collected",
    outstanding:"Outstanding Rent",
    addProperty:"+ Add Property",
    propertyName:"Property Name",
    propertyType:"Property Type",
    location:"Location",
    units:"Number of Units",
    governorate:"Governorate",
    city:"City",
    address:"Address",
    notes:"Notes",
    save:"Save Property",
    cancel:"Cancel",
    building:"Building",
    apartment:"Apartment",
    villa:"Villa",
    shop:"Commercial Shop",
    office:"Office",
    warehouse:"Warehouse",
    land:"Land",
    other:"Other",
    noProperties:"No properties added yet",
    noTenants:"No contracts recorded yet",
    noPayments:"No payments recorded yet",
    noExpenses:"No expenses recorded yet",
    noReports:"Financial reports will appear here",
    demo:"Demo — data is stored in this browser only",
    saved:"Property saved successfully"
  }
};

const governorates = [
  ["amman","عمّان","Amman"],
  ["irbid","إربد","Irbid"],
  ["zarqa","الزرقاء","Zarqa"],
  ["balqa","البلقاء","Balqa"],
  ["madaba","مادبا","Madaba"],
  ["karak","الكرك","Karak"],
  ["tafilah","الطفيلة","Tafilah"],
  ["maan","معان","Ma'an"],
  ["aqaba","العقبة","Aqaba"],
  ["mafraq","المفرق","Mafraq"],
  ["jerash","جرش","Jerash"],
  ["ajloun","عجلون","Ajloun"]
];

let currentLanguage = "ar";
let properties = [];

try {
  const stored = JSON.parse(
    localStorage.getItem("aqari-properties") || "[]"
  );
  if (Array.isArray(stored)) properties = stored;
} catch (error) {
  console.error("Unable to read saved properties", error);
}

function setLanguage(lang) {
  currentLanguage = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = translations[lang][key] || key;
  });

  const select = document.getElementById("governorate");
  const previous = select.value;
  select.replaceChildren();

  governorates.forEach(g => {
    const option = document.createElement("option");
    option.value = g[0];
    option.textContent = lang === "ar" ? g[1] : g[2];
    select.appendChild(option);
  });

  if (previous) select.value = previous;
document.getElementById("actionsHeader").textContent = lang === "ar" ? "الإجراءات" : "Actions";
  document.getElementById("language").value = lang;
  localStorage.setItem("aqari-language", lang);
  renderProperties();
}

function openModal() {
  document.getElementById("propertyModal").classList.add("open");
}



function closeModal() {
  document.getElementById("propertyModal").classList.remove("open");
  document.getElementById("propertyForm").reset();
  editingPropertyId = null;
}
 {
  document.getElementById("propertyModal").classList.remove("open");
  document.getElementById("propertyForm").reset();
  editingPropertyId = null;
}


function renderProperties() {
  const tbody = document.getElementById("propertyTable");
  tbody.replaceChildren();

  document.getElementById("propertyCount").textContent =
    properties.length;

  document.getElementById("unitCount").textContent =
    properties.reduce((sum, p) => sum + Number(p.units || 0), 0);

  if (properties.length === 0) {
    const row = tbody.insertRow();
    const cell = row.insertCell();
    cell.colSpan = 4;
    cell.textContent = translations[currentLanguage].noProperties;
    return;
  }

  properties.forEach(p => {
    const row = tbody.insertRow();
    const g = governorates.find(x => x[0] === p.governorate);
    const values = [
      p.name,
      translations[currentLanguage][p.type] || p.type,
      (g ? g[currentLanguage === "ar" ? 1 : 2] : "") +
        " - " + p.city,
      p.units
    ];
    values.forEach(value => {
      const cell = row.insertCell();
      cell.textContent = value;
    });
   
    const actionsCell = row.insertCell();

    const editButton = document.createElement("button");
    editButton.textContent =
      currentLanguage === "ar" ? "تعديل" : "Edit";
    editButton.onclick = () => editProperty(p.id);

    const deleteButton = document.createElement("button");
    deleteButton.textContent =
      currentLanguage === "ar" ? "حذف" : "Delete";
    deleteButton.style.background = "#dc2626";
    deleteButton.style.margin = "5px";
    deleteButton.onclick = () => deleteProperty(p.id);

    actionsCell.append(editButton, deleteButton);
 
  });
}

function deleteProperty(id) {
  const message = currentLanguage === "ar"
    ? "هل أنت متأكد من حذف هذا العقار؟"
    : "Are you sure you want to delete this property?";

  if (!confirm(message)) return;

  try {
    const deleted = AQARI.deleteProperty(id);

    if (!deleted) {
      alert(currentLanguage === "ar"
        ? "لم يتم العثور على العقار"
        : "Property not found");
      return;
    }

    properties = AQARI.getProperties();
    renderProperties();

    alert(currentLanguage === "ar"
      ? "تم حذف العقار بنجاح"
      : "Property deleted successfully");
  } catch (error) {
    alert(currentLanguage === "ar"
      ? "حدث خطأ أثناء حذف العقار"
      : "An error occurred while deleting the property");
  }
}

let editingPropertyId = null;

function editProperty(id) {
  const property = properties.find(p => p.id === id);

  if (!property) {
    alert(currentLanguage === "ar"
      ? "لم يتم العثور على العقار"
      : "Property not found");
    return;
  }

  editingPropertyId = id;

  document.getElementById("name").value = property.name;
  document.getElementById("type").value = property.type;
  document.getElementById("governorate").value =
    property.governorate;
  document.getElementById("city").value = property.city;
  document.getElementById("address").value = property.address;
  document.getElementById("units").value = property.units;
  document.getElementById("notes").value = property.notes || "";

  openModal();
}

  
document.getElementById("propertyForm")
  .addEventListener("submit", function(event) {
    event.preventDefault();

    const property = {
      id: editingPropertyId || crypto.randomUUID(),
      name: document.getElementById("name").value.trim(),
      type: document.getElementById("type").value,
      governorate: document.getElementById("governorate").value,
      city: document.getElementById("city").value.trim(),
      address: document.getElementById("address").value.trim(),
      units: Number(document.getElementById("units").value),
      notes: document.getElementById("notes").value.trim()
    };

    
const updated = editingPropertyId
  ? properties.map(p =>
      p.id === editingPropertyId ? property : p
    )
  : [...properties, property];


    try {
      localStorage.setItem(
        "aqari-properties", JSON.stringify(updated)
      );
      properties = updated;
      renderProperties();
      closeModal();
      this.reset();
      editingPropertyId = null;
      alert(translations[currentLanguage].saved);
    } catch (error) {
      alert(currentLanguage === "ar"
        ? "تعذر حفظ العقار في المتصفح"
        : "Unable to save property in browser");
    }
  });

const savedLanguage = localStorage.getItem("aqari-language");
setLanguage(savedLanguage === "en" ? "en" : "ar");
<script src="app.js"></script>
</body>
</html>
